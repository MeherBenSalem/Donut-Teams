  purged: "<green>Disbanded <white><count></white> teams inactive for <white><days></white> days."
  version: "<gray>Donut Teams <white><version></white> on <white><platform></white> · storage <white><storage></white> · economy <white><economy></white>"
  update: "<gold>Donut Teams <white><latest></white> is out (you have <white><version></white>): <white><url>"

board:
  title: "<#49d6a0><bold>TOP TEAMS</bold></#49d6a0> <dark_gray>·</dark_gray> <white><stat_name>"
  entry: "<gray>#<rank></gray> <team_display> <dark_gray>·</dark_gray> <white><value>"
  entry-top: "<gold>#<rank></gold> <team_display> <dark_gray>·</dark_gray> <yellow><value>"
  empty: "<gray>No teams yet. <white>/team create</white>!"
  footer: "<dark_gray>/team top"


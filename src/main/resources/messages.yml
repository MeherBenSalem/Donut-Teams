  info-name: "<aqua>Team info"
  members-name: "<yellow>Members"
  invites-name: "<gold>Invites"
  settings-name: "<white>Settings"
  home-name: "<green>Team home"
  sethome-name: "<aqua>Set home"
  delhome-name: "<red>Delete home"
  chat-name: "<light_purple>Team chat"
  pvp-name: "<red>Friendly fire"
  leave-name: "<red>Leave team"
  disband-name: "<dark_red>Disband team"
  back-name: "<gray>Back"
  close-name: "<red>Close"
  pvp-on: "<green>ON"
  pvp-off: "<red>OFF"
  chat-on: "<green>ON"
  chat-off: "<gray>OFF"
  home-set: "<green>Set"
  home-unset: "<dark_gray>Not set"
  owner-badge: "<gold>Owner"
  member-badge: "<gray>Member"
  toggle-perm: "<yellow>Click to toggle <white><perm>"
  kick-name: "<red>Kick"
  transfer-name: "<gold>Transfer ownership"
  pro-locked: "<dark_gray>NightTeams Pro"
  pro-allies: "<gray>Allies / wars"

# Donut Teams lite 1.0.0 — Nightbeam Studio
# Pro keys below are stubs only. Lite ignores them.

storage:
  type: SQLITE
  sqlite:
    file: teams.db
  mysql:
    host: localhost
    port: 3306
    database: donut_teams
    username: root
    password: password
    parameters: useSSL=false&characterEncoding=utf8

teams:
  # Lite hard-caps at 8 even if a higher donutteams.slots.<n> node exists.
  default-max-members: 8
  lite-max-members: 8
  name-min: 3
  name-max: 16
  tag-min: 2
  tag-max: 6
  invite-expire-seconds: 300

home:
  warmup-seconds: 3
  cancel-on-move: true
  # One unnamed team home in lite. Personal homes are a future SKU.

chat:
  enabled: true

pvp:
  # Default friendly-fire state for newly created teams.
  default-friendly-fire: false

metrics:
  enabled: true
  # bStats plugin id is assigned after the Modrinth listing. 0 = stub / skip.
  bstats-id: 0

# ---------------------------------------------------------------------------
# Pro (not implemented in lite — reserved for the paid SKU)
# ---------------------------------------------------------------------------
pro:
  redis:
    enabled: false
    host: localhost
    port: 6379
    password: ""
    channel: donutteams:sync
  extra-homes: false
  extra-home-limit: 5
  personal-homes: false
  cosmetics: false
  tablist: false
  color-prefixes: false
  allies: false
  team-bank: false

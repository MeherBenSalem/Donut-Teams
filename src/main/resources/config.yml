# Donut Teams lite 1.0.0 — Nightbeam Studio
# Advanced features (Redis, multi-homes, allies, bank, cosmetics) ship in NightTeams Pro (separate repository).

storage:
  type: SQLITE
  sqlite:
    file: teams.db

teams:
  # Hard-caps at 8 even if a higher donutteams.slots.<n> node exists.
  default-max-members: 8
  lite-max-members: 8
  name-min: 3
  name-max: 16
  tag-min: 2
  tag-max: 6
  invite-expire-seconds: 300

home:
  warmup-seconds: 3
  cancel-on-move: true

chat:
  enabled: true

pvp:
  # Default friendly-fire state for newly created teams.
  default-friendly-fire: false

metrics:
  enabled: true
  # bStats plugin id. 0 = stub / skip.
  bstats-id: 0

  rows: 6
  items:
    info:
      slot: 4
      material: TEAM_ICON
      name: "<team_display> <tag_display>"
      lore:
        - "<gray><italic><description>"
        - ""
        - "<gray>Owner <white><owner>"
        - "<gray>Level <white><level></white>/<white><max_level>"
        - "<gray>Members <white><members></white>/<white><max_members></white> <dark_gray>(<green><online> online</green>)"
        - "<gray>Kills <white><kills></white> · KDR <white><kdr>"
        - "<gray>Bank <green><balance>"
        - "<gray>Rank <white>#<rank_kills></white> by kills"
        - ""
        - "<gray>You are <role>"
    members:
      slot: 19
      material: PLAYER_HEAD
      name: "<yellow><bold>Members"
      lore: ["<gray><white><members></white>/<white><max_members></white> members, <green><online> online", "", "<yellow>Click to manage"]
    homes:
      slot: 21
      material: RED_BED
      name: "<green><bold>Team homes"
      lore: ["<gray><white><homes></white>/<white><max_homes></white> homes", "", "<yellow>Click to teleport or manage"]
    bank:
      slot: 23
      material: GOLD_INGOT
      name: "<gold><bold>Team bank"
      lore: ["<gray>Balance: <green><balance>", "", "<yellow>Click to deposit or withdraw"]
    chest:
      slot: 25
      material: ENDER_CHEST
      name: "<light_purple><bold>Team chest"
      lore: ["<gray><white><chest_rows></white> rows shared by the team", "", "<yellow>Click to open"]
    relations:
      slot: 29
      material: SHIELD
      name: "<aqua><bold>Allies & enemies"
      lore: ["<gray>Allies <aqua><allies></aqua> · Enemies <red><enemies>", "", "<yellow>Click to manage"]
    level:
      slot: 31
      material: EXPERIENCE_BOTTLE
      name: "<gold><bold>Team level <white><level>"
      lore: ["<gray>Next level: <white><next_level_cost>", "", "<yellow>Click to see the levels"]
    top:
      slot: 33
      material: DIAMOND
      name: "<aqua><bold>Top teams"
      lore: ["<gray>Your team is <white>#<rank_kills></white> by kills.", "", "<yellow>Click to view"]
    chat:
      slot: 47
      material: OAK_SIGN
      name: "<#49d6a0><bold>Team chat"
      lore: ["<gray>Mode: <chat_mode>", "", "<yellow>Click to switch", "<dark_gray>Or type /tc <message>"]
    settings:
      slot: 49
      material: COMPARATOR
      name: "<white><bold>Settings"
      lore: ["<gray>Friendly fire <pvp>", "<gray>Joining: <open>", "", "<yellow>Click to change"]
    leave:
      slot: 51
      material: OAK_DOOR
      name: "<red><bold>Leave team"
      lore: ["<gray>Leave <team>.", "", "<red>Click to leave"]
    disband:
      slot: 51
      material: TNT
      name: "<dark_red><bold>Disband team"
      lore: ["<gray>Delete the team for good.", "<gray>The bank and chest go to you.", "", "<red>Click to disband"]


# Donut Teams 2.0 menus. Every title, slot, item and line of text can be changed here.
#
#  slot / slots     where an item goes (0 = top left, 8 = top right, 9 = second row...). Ranges like "10-16" work.
#  material         any item name. Special values: TEAM_ICON (the team's banner or icon), PLAYER_HEAD (the viewer),
#                   TEAM_DYE (the dye of the team colour).
#  name / lore      MiniMessage (or & codes). Placeholders such as <team>, <members>, <balance> are filled in;
#                   the README lists them per menu.
#  content          slots that list things (members, homes, teams...). Lists longer than this get pages.
#  Remove an item (or set its slot to -1) to hide it.
menus-version: 2

filler:
  material: GRAY_STAINED_GLASS_PANE
  name: " "

common:
  previous: {material: ARROW, name: "<white>Previous page", lore: ["<gray>Page <page>/<pages>"]}
  next: {material: ARROW, name: "<white>Next page", lore: ["<gray>Page <page>/<pages>"]}
  back: {material: DARK_OAK_DOOR, name: "<gray>Back"}
  close: {material: BARRIER, name: "<red>Close"}
  empty: {material: GRAY_DYE, name: "<gray>Nothing here yet"}

no-team:
  title: "<dark_gray>Teams"
  rows: 3
  items:
    create:
      slot: 11
      material: NETHER_STAR
      name: "<#49d6a0><bold>Create a team"
      lore:
        - "<gray>Start your own team: invite friends,"
        - "<gray>share homes, a bank and a chest."
        - ""
        - "<yellow>Click to name your team"
    invites:
      slot: 13
      material: WRITABLE_BOOK
      name: "<gold><bold>Your invites <gray>(<white><count></white>)"
      lore:
        - "<gray>Teams that invited you."
        - ""
        - "<yellow>Click to view"
    browse:
      slot: 15
      material: COMPASS
      name: "<aqua><bold>Browse teams"
      lore:
        - "<gray>Find a team to join or ask."
        - "<gray>There are <white><teams></white> teams."
        - ""
        - "<yellow>Click to browse"
    top:
      slot: 22
      material: GOLD_INGOT
      name: "<gold><bold>Top teams"
      lore: ["<gray>The best teams on the server.", "", "<yellow>Click to view"]

main:

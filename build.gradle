plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.3.1'
}

group = 'io.nightbeam'
version = '1.0.0'
description = 'Donut Teams lite — Folia-first team GUI, homes, chat, and PvP for Paper.'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'extendedclip'
        url = 'https://repo.extendedclip.com/releases/'
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.20.6-R0.1-SNAPSHOT'
    compileOnly 'me.clip:placeholderapi:2.11.6'

    implementation 'com.zaxxer:HikariCP:5.1.0'
    implementation 'org.xerial:sqlite-jdbc:3.45.3.0'
    implementation 'com.mysql:mysql-connector-j:8.3.0'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
    implementation 'org.bstats:bstats-bukkit:3.1.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
    from(rootProject.projectDir) {
        include 'LICENSE'
        include 'NOTICE'
        into 'META-INF'
    }
}

shadowJar {
    archiveBaseName.set('DonutTeams')
    archiveClassifier.set('')
    exclude 'META-INF/LICENSE.txt'
    exclude 'META-INF/NOTICE.txt'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'LICENSE'
    exclude 'README'
    exclude 'NOTICE'
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
    }
    from(rootProject.file('NOTICE')) {
        into 'META-INF'
    }
    relocate 'com.zaxxer.hikari', 'io.nightbeam.donutteams.lib.hikari'
    relocate 'com.github.benmanes.caffeine', 'io.nightbeam.donutteams.lib.caffeine'
    relocate 'com.mysql', 'io.nightbeam.donutteams.lib.mysql'
    relocate 'org.sqlite', 'io.nightbeam.donutteams.lib.sqlite'
    relocate 'org.bstats', 'io.nightbeam.donutteams.lib.bstats'
}

tasks.named('jar') {
    enabled = false
}

tasks.named('build') {
    dependsOn shadowJar
}

tasks.named('test') {
    useJUnitPlatform()
}

# NightBeam plugin CI: build, unit tests, Folia-safety check and the Paper API compile matrix; the plugin.yml / bStats /
# Java 17 check; and smoke boots on real servers (Paper 1.20.1, Paper 26.3 and the newest Folia).
# The full gameplay matrix with bots is tools/smoke (run by hand).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The build's toolchain is Java 25 (the 26.x API jars are Java 25 bytecode); the plugin targets Java 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests, Folia-safety check
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Compile against every Paper API from 1.20.6 to 26.3
        run: ./gradlew compileMatrix --no-daemon
      # Native dialogs (io/nightbeam/donutteams/dialog) are Java 21 and only load on 1.21.7+ servers.
      - name: Check plugin.yml, bStats ID and Java 17 bytecode
        run: python3 scripts/check_plugin_yml.py --jar "$(ls build/libs/DonutTeams-*.jar | head -1)" --allow-newer io/nightbeam/donutteams/dialog/
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Publisher script tests (same-day guard)
        run: node --test scripts/*.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: DonutTeams-jar
          path: build/libs/DonutTeams-*.jar
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Paper 1.20.1
            project: paper
            version: "1.20.1"
            java: "17"
          - name: Paper 26.3
            project: paper
            version: "26.3"
            java: "25"
          - name: Folia (newest)
            project: folia
            version: latest
            java: "25"
    name: Smoke ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DonutTeams-jar
          path: artifact
      - uses: actions/setup-java@v4
        id: java
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Boot ${{ matrix.name }}
        env:
          JAVA_BIN: ${{ steps.java.outputs.path }}/bin/java
        run: scripts/smoke_boot.sh ${{ matrix.project }} ${{ matrix.version }} "$(ls artifact/DonutTeams-*.jar | head -1)"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log-${{ matrix.project }}-${{ matrix.version }}
          path: build/smoke/*/server.log
          if-no-files-found: ignore
